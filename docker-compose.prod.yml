version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ems
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ems -d ems']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ems:${POSTGRES_PASSWORD:?set in .env}@db:5432/ems
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ems:${POSTGRES_PASSWORD:?set in .env}@db:5432/ems
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
