services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ems_dev_password}
      POSTGRES_DB: ems
    ports:
      - '5433:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ems -d ems']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://ems:${POSTGRES_PASSWORD:-ems_dev_password}@db:5432/ems
      NODE_ENV: production
      # Must be set in /opt/ems/.env (openssl rand -hex 32). Fails closed if missing.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - add it to /opt/ems/.env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.shabro2a.com}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-dev_webhook_secret_change_in_prod}
      # Web Push (caller ring on locked phones). Optional: unset = in-app alarm only.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@shabro2a.com}
      # Keep dev GPS-bypass endpoints OFF in production.
      ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-false}
      NEXT_PUBLIC_ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-false}
      # Error monitoring. Unset = Sentry stays off (app still runs normally).
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ems:${POSTGRES_PASSWORD:-ems_dev_password}@db:5432/ems
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - add it to /opt/ems/.env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.shabro2a.com}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-dev_webhook_secret_change_in_prod}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
