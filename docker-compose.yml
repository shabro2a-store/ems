services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems_dev_password
      POSTGRES_DB: ems
    ports:
      - '5433:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ems -d ems']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://ems:ems_dev_password@db:5432/ems
      NODE_ENV: production
      JWT_SECRET: dev_only_secret_replace_in_prod_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.shabro2a.com}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-dev_webhook_secret_change_in_prod}
      ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-false}
      NEXT_PUBLIC_ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-false}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://ems:ems_dev_password@db:5432/ems
      NODE_ENV: production
      JWT_SECRET: dev_only_secret_replace_in_prod_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.shabro2a.com}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-dev_webhook_secret_change_in_prod}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: