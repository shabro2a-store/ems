name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ems -d ems_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ems:test@localhost:5432/ems_test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod-0123456789abcdef0123456789abcdef
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Generate the Prisma client before anything imports @prisma/client.
      - run: pnpm --filter db exec prisma generate

      - run: pnpm --filter db exec prisma migrate deploy

      - run: pnpm -r typecheck

      # The HTTP integration tests hit a live server at TEST_BASE_URL, so build
      # and boot the web app before running the suite.
      - name: Build web app
        run: pnpm --filter web exec next build
        env:
          NODE_ENV: production

      - name: Start server and run tests
        env:
          NODE_ENV: production
          TEST_BASE_URL: http://127.0.0.1:3000
        run: |
          pnpm --filter web exec next start -p 3000 &
          SERVER_PID=$!
          echo "web server pid=$SERVER_PID; waiting for health..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "server ready after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health || { echo "server never became healthy"; exit 1; }
          set +e
          NODE_ENV=test pnpm -r test
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS
