name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ems -d ems_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ems:test@localhost:5432/ems_test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod-0123456789abcdef0123456789abcdef
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter db prisma migrate deploy

      - run: pnpm -r typecheck

      - run: pnpm -r test
