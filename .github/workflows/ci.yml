name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ems -d ems_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Throwaway database for the drift check below: Prisma replays every
      # migration into it to see what schema they produce.
      shadow:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ems_shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ems -d ems_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ems:test@localhost:5432/ems_test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod-0123456789abcdef0123456789abcdef
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Generate the Prisma client before anything imports @prisma/client.
      - run: pnpm --filter db exec prisma generate

      - run: pnpm --filter db exec prisma migrate deploy

      # schema.prisma and the migrations must describe the same database.
      # Migrations are what production runs; a schema that disagrees makes the
      # next `prisma migrate dev` write a migration that quietly undoes part of
      # them. Fails the build when they drift; run it locally to see the SQL.
      - name: Schema matches migrations
        run: >-
          pnpm --filter db exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://ems:test@localhost:5433/ems_shadow
          --exit-code

      # The role production's web and worker log in as. The server below runs as
      # it, so code that needs more than row access fails here, not in production.
      - name: App database role
        run: pnpm --filter db db:app-role
        env:
          APP_DB_PASSWORD: test-app-role-password-0123456789

      - run: pnpm -r typecheck
      - run: pnpm --filter web lint

      # The HTTP integration tests hit a live server at TEST_BASE_URL, so build
      # and boot the web app before running the suite.
      - name: Build web app
        run: pnpm --filter web exec next build
        env:
          NODE_ENV: production

      - name: Start server and run tests
        env:
          NODE_ENV: production
          TEST_BASE_URL: http://127.0.0.1:3000
        run: |
          DATABASE_URL=postgresql://ems_app:test-app-role-password-0123456789@localhost:5432/ems_test pnpm --filter web exec next start -p 3000 &
          SERVER_PID=$!
          echo "web server pid=$SERVER_PID; waiting for health..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "server ready after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health || { echo "server never became healthy"; exit 1; }
          set +e
          NODE_ENV=test pnpm -r test
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS
